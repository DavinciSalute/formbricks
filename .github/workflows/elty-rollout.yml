---
name: elty-build-docker

on:
  workflow_dispatch:
  push:
    branches:
      - elty_main
      - elty_qa
  pull_request:
    branches:
      - feature-sc-*
      - elty_main
      - elty_qa

concurrency:
  group: formbricks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-tag:
    name: compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: compute docker tag
        uses: davincisalute/actions/compute-docker-tag@v3
        id: tag
        with:
          app: formbricks

  build:
    strategy:
      fail-fast: false
    name: formbricks
    runs-on: github-action-runner-scale-set-docker
    needs: docker-tag
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and push ${{ matrix.app }}
        uses: davincisalute/actions/docker-build@v3
        with:
          app: ${{ matrix.app }}
          dockerfile: apps/web/Dockerfile
          google-credentials: '${{ secrets.GOOGLE_CREDENTIALS }}'
          repo: europe-west8-docker.pkg.dev/common-project-bd8c/common-repo/formbricks
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_SECRET }}
          tag: ${{ needs.docker-tag.outputs.version }}
          build-args: |
            NPM_AUTH_TOKEN=${{ secrets.NPM_AUTH_TOKEN }}

  rollout-commit:
    name: 'Update davinci-infra with new version'
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    needs: [docker-tag, build]
    steps:
      - name: rollout commit
        uses: davincisalute/actions/rollout-commit@v3
        with:
          app: formbricks
          docker_tag: ${{ needs.docker-tag.outputs.version }}
          gh_app_private_key: '${{ secrets.GH_APP_PRIVATE_KEY }}'
          image_prefix: production
          path: common/formbricks
          use_env: false

